name: Ingest agents

# Keeps the index current without running a server.
#
# WHY GITHUB ACTIONS AND NOT CRON ON A BOX
#
# The obvious objection to a scheduled job is hosting cost, and it does not apply here:
# this needs no always-on process. The work is a short CLI invocation against Postgres,
# so a scheduled workflow does it on GitHub's runners for nothing, and the run history is
# more observable than crontab on a machine nobody is watching.
#
# WHY ONE JOB AND NOT LOG REPLAY
#
# ERC-8004 mints agent ids from a monotonic counter, so every new registration has a
# higher id than the last. Walking from our cursor to the highest minted id therefore
# catches everything new — no `eth_getLogs`, and so no dependence on log retention. That
# matters because free RPC tiers cannot serve log history at all: Alchemy's free tier caps
# `eth_getLogs` at 10 blocks and publicnode retains roughly 8k, which on BSC is about two
# hours. The id walk has no such limit.
#
# Measured: 412 new agents caught up in 5 seconds, one pass.
#
# WHY THIS IS SCHEDULED AGAIN
#
# It was unscheduled because every timed run failed: the steps read a DATABASE_URL secret
# that did not exist, since the deployed catalogue was a snapshot indexed from a full local
# database. Two things have changed.
#
# The secret exists, under a different name. `DEPLOYED_DATABASE_URL` is already set for the
# migrate and restore workflows, and it is the same database this should be advancing.
#
# And the snapshot is no longer adequate. A campaign asks users to register an agent of
# their own and then find it here, and a catalogue frozen 28 days ago cannot show it: the
# registration is real, on chain, and invisible. That is a broken half of the quest, not a
# stale figure.
#
# ONLY THE NEW-AGENT PASS IS SCHEDULED, AND THAT IS THE POINT
#
# Storage is the binding constraint: 476 MB of a 1 GB free tier, with the registry growing
# about 130 MB a month. The new-agent walk writes only genuinely new rows, so scheduled
# growth tracks real registrations and the campaign fits with headroom.
#
# The metadata and reputation passes stay manual. Metadata would resolve a backlog of
# 80,951 agents, writing a full registration file for each — storage spent on rows that are
# already listed and browsable, to fill in descriptions. That is worth doing deliberately,
# not on a timer that competes with the space new agents need.
#
# COST
#
# The arithmetic that made this unaffordable was a private repository: 2,000 Actions minutes
# a month against ~1,440 for a 30-minute cadence, before the keepalive's ~4,320. Both repos
# are public now, so minutes are unlimited and the objection is gone.
#
# CADENCE
#
# Every 15 minutes, because a builder who has just registered an agent is waiting for it.
# GitHub throttles scheduled workflows under load and will skip runs — keepalive.yml records
# the same — so treat this as an upper bound on freshness, not a guarantee. The id walk is
# cursor-based, so a skipped run costs nothing: the next one catches up.
#
# Measured: 412 new agents caught up in 5 seconds, one pass.

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Also resolve deferred metadata and sweep reputation (writes more storage)'
        type: boolean
        default: false

# A run that overlaps its predecessor would be refused by the database advisory lock
# anyway. Cancelling here is cheaper than paying for a job that exits immediately.
concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Generous ceiling relative to the ~1 minute this takes, so a slow RPC does not fail
    # the run, but bounded so a hung request cannot burn the monthly minute budget.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. Supplying one alongside `packageManager` in package.json
      # makes the action refuse outright — "Multiple versions of pnpm specified" — which is the
      # second reason every scheduled run failed, independent of the missing database secret.
      # Left unset, it reads the pinned 10.33.0 from package.json, which is the version that
      # wrote the lockfile.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Caching the store is most of why a run fits in a minute.
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # New agents. Cheap and fast: two Multicall3 requests per 120 ids.
      - name: Index new agents
        env:
          # The deployed catalogue. Named DEPLOYED_ in the secret because the migrate and
          # restore workflows use the same one; the app only ever reads DATABASE_URL.
          DATABASE_URL: ${{ secrets.DEPLOYED_DATABASE_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          BSC_RPC_URL_FALLBACK: ${{ secrets.BSC_RPC_URL_FALLBACK }}
        run: pnpm sync:agents --backfill --loop

      # Registration files that discovery deferred — the ~6% published behind a
      # third-party URL rather than inline. Bounded per run because this step waits on
      # other people's web servers, and one slow host must not consume the whole budget.
      #
      # `continue-on-error` because a description arriving late is not a failure: the
      # agent is already indexed and browsable, and the UI shows unresolved metadata
      # honestly rather than hiding the agent.
      #
      # Opt-in, never on the timer. This would work through a backlog of 80,951 agents, writing
      # a full registration file per row, and spend the storage a campaign needs for genuinely
      # new registrations on filling in descriptions for agents that are already listed. Run it
      # deliberately, with the storage headroom in front of you.
      - name: Resolve deferred registration files
        if: inputs.full
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DEPLOYED_DATABASE_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          IPFS_GATEWAY_URL: ${{ secrets.IPFS_GATEWAY_URL }}
        run: pnpm sync:agents --metadata --loop --limit 240

      # Reputation for the whole catalogue, one slice per run.
      #
      # Reputation used to be read only when a visitor opened a profile, which left 130 of
      # 317,476 agents scored, and meant the "highest reputation" and "most feedback" sorts
      # ranked a set of 130 while `nulls last` parked the other 317,346 behind them.
      #
      # Batched over Multicall3 the full sweep measures 168 ids/sec, so about 31 minutes.
      # That does not fit one run of this workflow, hence the cursor: one bounded pass per
      # run, resumed from where the last one stopped. 12,000 ids takes roughly 70 seconds
      # and on a 30-minute cadence covers the catalogue in about half a day, after which the
      # cursor wraps and the sweep keeps the figures current.
      #
      # A single pass rather than `--loop`, deliberately. Looping here would run past the
      # job timeout and be killed, which costs nothing in correctness (the cursor advances
      # per pass) but reports a red run every time and makes a real failure invisible.
      #
      # Last of the three steps, because it is the least urgent: a missing score degrades a
      # sort, where a missing agent is absent from the marketplace entirely.
      #
      # Opt-in for the same reason and one more: this updates existing rows rather than adding
      # them, so it costs no storage, but it is the least urgent of the three. A missing score
      # degrades a sort; a missing agent is absent from the marketplace entirely.
      - name: Sweep reputation
        if: inputs.full
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DEPLOYED_DATABASE_URL }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          BSC_RPC_URL_FALLBACK: ${{ secrets.BSC_RPC_URL_FALLBACK }}
        run: pnpm sync:agents --reputation --limit 12000
