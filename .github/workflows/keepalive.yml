name: Keep the API warm

# A free Render web service spins down after 15 minutes without inbound traffic, and the next
# request waits about a minute while it starts. That minute lands on whoever arrives first, which
# during judging is the worst possible person to spend it on.
#
# So this pings often enough to stay under that window. It is not a workaround for a broken
# service: the instance is healthy, it is asleep, and the platform documents both.
#
# WHY TWO SCHEDULES, AND WHY THE FREQUENT ONE AVOIDS THE DATABASE
#
# The first version of this pinged /health every 10 minutes, and that took the site down.
#
# /health runs two queries, by design, because it reports database and ingestion state. Neon
# suspends a project's compute when idle and bills the awake time against a monthly allowance
# (100 CU-hours on the free plan). A query every 10 minutes never lets it idle, so the keepalive
# held the compute awake around the clock and spent the database's entire monthly budget proving
# that the web process was up. Neon then suspended the compute for the rest of the cycle, which
# refuses every connection, and the API served 503s.
#
# The two questions are now asked separately, at the frequency each is worth:
#
#   every 10 minutes  ->  /live    keeps Render awake, runs no queries, costs the database nothing
#   every 6 hours     ->  /health  proves the database and ingestion are actually healthy
#
# Waking Neon four times a day is negligible against the allowance, and it still catches a dead
# database within a few hours. Between those checks the compute is allowed to sleep, which is the
# behaviour the free plan is priced around.
#
# WHY NOT /
#
# `/` is a 404 on this API. It would still wake the service but would fill the logs with failures
# and make a real problem harder to spot.
#
# COST
#
# Public repositories get unlimited Actions minutes. On a private repository this would consume
# roughly 4,300 minutes a month against a 2,000 allowance, so it must stay public or move to an
# external cron.

on:
  schedule:
    # Liveness. Every 10 minutes, comfortably inside the 15-minute idle window even when GitHub
    # delays a scheduled run, which it does not guarantee to be punctual about.
    - cron: '*/10 * * * *'
    # Readiness. Offset off the hour so it does not collide with the liveness run.
    - cron: '7 */6 * * *'
  workflow_dispatch:

# A queued ping is worthless once a later one has run, so never wait.
concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Wake the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -uo pipefail

          if [ -z "${API_URL:-}" ]; then
            echo "API_URL repository variable is not set; nothing to ping."
            exit 0
          fi

          # --max-time 120, because a cold start is about a minute and the point of this request
          # is to absorb that wait rather than to fail on it.
          code=$(curl -sS --max-time 120 -o /dev/null -w '%{http_code}' "$API_URL/live") || {
            echo "::error::ping failed to complete"
            exit 1
          }

          echo "GET /live -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::/live returned HTTP $code"
            exit 1
          fi

      # Gated so the frequent run never reaches the database. Runs on the 6-hourly schedule and
      # on a manual dispatch, where someone is asking on purpose.
      - name: Check the database and ingestion are healthy
        if: github.event.schedule == '7 */6 * * *' || github.event_name == 'workflow_dispatch'
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          set -uo pipefail

          if [ -z "${API_URL:-}" ]; then
            echo "API_URL repository variable is not set; nothing to check."
            exit 0
          fi

          body=$(curl -sS --max-time 120 -w '\n%{http_code}' "$API_URL/health") || {
            echo "::error::health check failed to complete"
            exit 1
          }

          code=$(printf '%s' "$body" | tail -n1)
          payload=$(printf '%s' "$body" | sed '$d')

          echo "GET /health -> HTTP $code"
          echo "$payload"

          if [ "$code" != "200" ]; then
            echo "::error::API returned HTTP $code"
            exit 1
          fi

          # A 200 whose database is down is not healthy, and this is the only scheduled thing
          # looking at production, so it checks the payload rather than just the status line.
          case "$payload" in
            *'"database":"up"'*) echo "database up" ;;
            *) echo "::error::API answered 200 but reports the database as unavailable"; exit 1 ;;
          esac
