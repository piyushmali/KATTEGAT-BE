# Render blueprint for the KATTEGAT API.
#
# Committed so the deployment is reviewable and reproducible rather than a set of choices
# someone made in a web form once. Render reads this on "New Blueprint" and creates the service
# with these settings.
#
# WHY FREE, AND WHAT THAT COSTS
#
# A free web service spins down after 15 minutes without inbound traffic, and the next request
# waits about a minute for it to start. That is survivable for a demo but bad for a judge's first
# impression, so the ingestion workflow pings /health on a schedule to keep it warm. 750 instance
# hours a month covers one service running continuously (730), so staying warm is within budget.
#
# The database is deliberately NOT declared here. Render's free Postgres is deleted after 30 days,
# which would take the catalogue with it partway through a judging window. Neon's free tier has no
# such expiry, so the database lives there and DATABASE_URL points at it. See docs/deployment.md.

services:
  - type: web
    name: kattegat-api
    runtime: node
    plan: free
    # Singapore is the closest free region to both the operator and BSC's RPC endpoints.
    region: singapore

    # `corepack pnpm`, not `corepack enable`, and the difference is a broken deploy.
    #
    # This was `corepack enable && pnpm install …`, which worked until Render's build image began
    # shipping its own pnpm at /usr/bin/pnpm on a read-only filesystem. `corepack enable` installs
    # itself by replacing that symlink, so it now dies before anything is installed:
    #
    #   Internal Error: EROFS: read-only file system, unlink '/usr/bin/pnpm'
    #
    # The reason `corepack enable` was here at all is the version pin: `--frozen-lockfile` compares
    # against a lockfile format, and Render's preinstalled pnpm is not necessarily the pnpm that
    # wrote pnpm-lock.yaml (lockfileVersion 9.0, written by the pnpm@10.33.0 in `packageManager`).
    # Dropping corepack entirely would trade this failure for a subtler one.
    #
    # `corepack pnpm <args>` resolves `packageManager` and runs that exact version as a shim,
    # writing no symlinks and touching nothing outside the project. Verified: it reports 10.33.0,
    # matching the pin.
    #
    # DOWNLOAD_PROMPT is disabled because corepack asks for confirmation before fetching a version
    # it has not cached, and a build agent has no one to answer it.
    #
    # `&&` rather than `;` throughout, so a failed install does not continue into a misleading
    # TypeScript error from a half-populated node_modules.
    buildCommand: export COREPACK_ENABLE_DOWNLOAD_PROMPT=0 && corepack pnpm install --frozen-lockfile && corepack pnpm build
    # Plain `pnpm` is fine here: `start` is `node dist/index.js`, so no pnpm behaviour is load
    # bearing and whichever version the image provides will do.
    startCommand: pnpm start

    # Render restarts the service when this stops answering, and uses it to decide a deploy
    # succeeded. That is a liveness question — "is this process serving?" — so it points at
    # /live, which answers without touching Postgres.
    #
    # It used to point at /health, on the reasoning that a service which cannot reach its
    # database should fail the deploy rather than serve errors. That reasoning does not survive
    # contact with what the check actually does. /health runs two queries, so a slow or
    # saturated database makes it slow, Render concludes the process is dead and restarts it.
    # Restarting a web process does not repair a database: it discards the warm stats cache,
    # adds a cold start, and if the database is still slow the new process fails the same check.
    # A degraded dependency becomes a restart loop, which is a worse outage than the degradation.
    #
    # The database is still watched, deliberately and separately: keepalive.yml calls /health
    # every six hours and fails loudly if it does not report `database: up`. Readiness is
    # reported, liveness is acted on, and the two are no longer the same signal.
    healthCheckPath: /live

    envVars:
      - key: NODE_ENV
        value: production
      # Redundant since config/env.ts defaults HOST to 0.0.0.0 whenever NODE_ENV is production,
      # and kept anyway because this file is also documentation. Binding loopback in a container
      # makes the service unreachable while every log line looks healthy, and Render reports it as
      # "No open ports detected on 0.0.0.0" — a message naming neither the variable nor the
      # process. Worth being explicit about the thing that failure taught us.
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: '24'
      - key: LOG_LEVEL
        value: info

      # Set in the dashboard, not here. `sync: false` tells Render to prompt rather than to
      # expect a value in this file, which keeps connection strings and keys out of git.
      - key: DATABASE_URL
        sync: false
      # Comma-separated. Must include the Vercel origin, or every browser request is blocked by
      # CORS while curl keeps working, which is a confusing way to find out.
      - key: CORS_ORIGINS
        sync: false
      - key: BSC_RPC_URL
        sync: false
      - key: BSC_RPC_URL_FALLBACK
        sync: false

      # Which chain hiring runs on. `bnb-testnet` until real funds are intended; config/env.ts
      # refuses mainnet unless NODE_ENV is production, so this is the one value that decides
      # whether a mistake costs money.
      - key: ALTANA_NETWORK
        value: bnb-testnet

      # Optional. Without it the gas sponsor is simply disabled and users fund their own gas,
      # which the hiring panel already reports honestly.
      - key: AGENT_GAS_SPONSOR_PRIVATE_KEY
        sync: false
